name: Sync Source

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync_stars.py
      - name: Enrich apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python enrich_apps.py
      - name: Build source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_source.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.toml previous_stars.json apps_data.json apps.json
          [ -d icons ] && git add icons/ || true
          git diff --cached --quiet || (git commit -m "sync source" && git push)
